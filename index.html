<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#172e35;background:#f2f6f5}*{box-sizing:border-box}body{margin:0}header{background:#153f44;color:white;padding:18px 24px}header h1{font-size:1.2rem;margin:0}header p{margin:5px 0 0;color:#cee2dd;font-size:.85rem}main{max-width:1100px;margin:auto;padding:20px}section,.card{background:white;border:1px solid #dbe7e4;border-radius:14px;padding:18px;margin-bottom:15px}h2{margin:0 0 12px;font-size:1.15rem}h3{font-size:1rem}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #b9cdca;border-radius:8px;background:white}textarea{min-height:92px;resize:vertical}button{font:inherit;cursor:pointer;border:0;border-radius:8px;background:#176960;color:white;padding:11px 15px;font-weight:650}button.secondary{background:#edf4f2;color:#244f4c;border:1px solid #bed2cf}button.danger{background:#9a403c}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.buttons button{flex:1}.muted{color:#5a716e;font-size:.9rem}.pill{display:inline-block;border-radius:99px;background:#e1f1eb;color:#176457;padding:4px 10px;font-size:.83rem;font-weight:700}.item{width:100%;text-align:left;display:block;background:#fff;color:inherit;border:1px solid #d5e3df;margin:8px 0}.item strong{font-size:1rem}.item span{display:block;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.field{padding:10px;background:#f4f8f7;border-radius:8px;overflow-wrap:anywhere}.field small{display:block;color:#66807a}.field b{white-space:pre-wrap}.progress{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.progress span{padding:7px 10px;border-radius:8px;background:#edf3f1}.progress .active{background:#d3eee4;color:#075e50;font-weight:bold}canvas{width:100%;height:180px;border:1px solid #9cb9b2;border-radius:8px;touch-action:none;background:white}img{max-width:100%;max-height:300px;border:1px solid #d7e1df}#message{padding:10px 12px;background:#fff3d7;color:#714c09;border-radius:8px;margin-bottom:12px;white-space:pre-wrap}.hide{display:none!important}.history{border-left:3px solid #cce1da;padding:8px 12px;margin:8px 0}footer{text-align:center;color:#708580;font-size:.8rem;padding:12px}@media(max-width:600px){main{padding:12px}header{padding:16px}section{padding:14px}.row>*{min-width:100%}}
</style></head><body><header><h1>設備斷電申請</h1><p>斷電、施工與復電簽認</p></header><main><div id="message" class="hide" role="status"></div>
<section id="login"><h2>登入</h2><p class="muted">請輸入人員編制中的工號。</p><label for="emp">工號</label><input id="emp" autocomplete="off" placeholder="例如 N000000000"><div class="buttons"><button id="loginBtn">進入平台</button></div></section>
<div id="workspace" class="hide"><section><div class="row"><div><strong id="identity"></strong><p class="muted">只顯示您可查看的案件</p></div><button class="secondary" id="logout">登出</button></div></section>
<section id="listView"><div class="row"><div><h2>案件清單</h2><p class="muted">待您簽認的案件會顯示在最上方。</p></div><button id="newBtn" class="hide">新增申請</button></div><div class="row"><div><label for="search">搜尋案件、設備或申請人</label><input id="search" placeholder="輸入關鍵字"></div><div><label for="stateFilter">階段</label><select id="stateFilter"><option value="">全部階段</option><option>第一階段</option><option>施工中</option><option>第二階段</option><option>退回</option><option>已結案</option></select></div><div><label for="dateFrom">施工日期起</label><input type="date" id="dateFrom"></div><div><label for="dateTo">施工日期迄</label><input type="date" id="dateTo"></div></div><div id="cases" aria-live="polite"></div></section>
<section id="formView" class="hide"><h2 id="formTitle">新增斷電申請</h2><label for="device">設備編號</label><input id="device" maxlength="200"><label for="reason">原因說明</label><textarea id="reason" maxlength="2000"></textarea><div class="row"><div><label for="startDate">申請施工日期</label><input type="date" id="startDate"></div><div><label for="endDate">預定完成日</label><input type="date" id="endDate"></div></div><div class="buttons"><button class="secondary" id="cancelForm">取消</button><button id="submitForm">送出申請</button></div></section>
<div id="detailView" class="hide"><section><div class="row"><div><h2 id="detailId"></h2><span id="currentStage" class="pill"></span></div><button id="back" class="secondary">返回清單</button></div><div class="progress" id="progress"></div><div class="grid" id="facts"></div><div class="buttons"><button id="pdfBtn" class="secondary">下載 PDF</button><button id="restoreBtn" class="hide">提出復電申請</button><button id="resubmitBtn" class="hide">重新送出</button></div></section>
<section id="signBox" class="hide"><h2>本關簽認</h2><p class="muted">請先確認案件內容，再以手指或滑鼠親筆簽名。</p><canvas id="signature" aria-label="手寫簽名區"></canvas><div class="buttons"><button class="secondary" id="clearSign">清除重簽</button></div><div id="photoBox" class="hide"><label for="photo">上鎖照片（必填）</label><input type="file" id="photo" accept="image/jpeg,image/png"></div><div class="buttons"><button id="signBtn">確認簽認</button><button id="rejectBtn" class="danger">退回</button></div></section>
<section><h2>簽認歷程</h2><div id="history"></div></section></div></div></main><footer>設備斷電申請平台</footer>
<script>
const $=id=>document.getElementById(id); let user=null, cases=[], current=null, drawing=false, ink=false, operationKey=null, mode='create';
const key=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function msg(s){$('message').textContent=s||'';$('message').classList.toggle('hide',!s);if(s) window.scrollTo(0,0)}
function busy(on){document.querySelectorAll('button').forEach(b=>b.disabled=on)}
const API_URL='https://script.google.com/macros/s/AKfycbzflr-ER8w0goctscrOwPosgzh7lUST600CYRGKVmFMPzuVIxSb3TNSZT2JGdIQLWIOlw/exec';
async function api(name,...args){busy(true);msg('');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),120000);try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:name,args}),signal:controller.signal});if(!response.ok)throw Error('伺服器回應異常：'+response.status);const result=await response.json();if(!result.ok){const e=Error(result.message||'操作失敗');e.definitive=true;throw e}return result.value}catch(e){msg(e.name==='AbortError'?'連線逾時，請先確認案件狀態，再重試原操作。':e.message||String(e));throw e}finally{clearTimeout(timer);busy(false)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function view(which){['listView','formView','detailView'].forEach(x=>$(x).classList.toggle('hide',x!==which))}
async function load(){try{cases=await api('listCases',user.id);renderList();view('listView')}catch(e){}}
function group(c){if(c.stage==='施工中'||c.stage==='已結案')return c.stage;if(c.stage.includes('退回'))return '退回';return ['經辦復電','盤控人員復電','電儀人員復電','課長結案'].includes(c.stage)?'第二階段':'第一階段'}
function renderList(){const q=$('search').value.toLowerCase(),f=$('stateFilter').value,from=$('dateFrom').value,to=$('dateTo').value;const rows=cases.filter(c=>(!q||[c.id,c.device,c.applicantName].some(x=>String(x).toLowerCase().includes(q)))&&(!f||group(c)===f)&&(!from||c.startDate>=from)&&(!to||c.startDate<=to)).sort((a,b)=>Number(b.pending)-Number(a.pending));$('cases').innerHTML=rows.length?rows.map(c=>`<button class="item" data-id="${esc(c.id)}"><strong>${esc(c.device)}</strong> <span class="pill">${c.pending?'待您簽認 · ':''}${esc(c.stage)}</span><span class="muted">${esc(c.id)}　${esc(c.applicantName)}　${esc(c.startDate)} ～ ${esc(c.endDate)}</span></button>`).join(''):'<p class="muted">沒有符合條件的案件。</p>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openCase(b.dataset.id))}
async function openCase(id){try{current=await api('getCase',user.id,id);view('detailView');renderDetail()}catch(e){}}
function renderDetail(){const c=current.case,stage=current.stage;$('detailId').textContent=c.id;$('currentStage').textContent=stage;const g=group({stage});$('progress').innerHTML=['第一階段','施工中','第二階段','已結案'].map(x=>`<span class="${x===g?'active':''}">${x}</span>`).join('');const fields=[['申請人',c.applicantName],['單位',c.department],['督導主管',c.supervisorName],['設備編號',c.device],['原因說明',c.reason],['施工日期',c.startDate],['預定完成日',c.endDate]];$('facts').innerHTML=fields.map(([a,b])=>`<div class="field"><small>${esc(a)}</small><b>${esc(b)}</b></div>`).join('');$('signBox').classList.toggle('hide',!current.canSign);$('photoBox').classList.toggle('hide',stage!=='電儀人員斷電');$('restoreBtn').classList.toggle('hide',!(c.phase===3&&c.applicant===user.id));$('resubmitBtn').classList.toggle('hide',!([-1,-2].includes(c.phase)&&c.applicant===user.id));$('history').innerHTML=c.history.length?c.history.map((h,i)=>`<div class="history"><strong>${esc(h.stage)} · ${esc(h.action)}</strong><div class="muted">${esc(h.name||h.actor)}　${esc(new Date(h.time).toLocaleString('zh-TW'))}</div>${h.reason?`<p>退回原因：${esc(h.reason)}</p>`:''}${h.photo?`<button class="secondary photo-link" data-file="${esc(h.photo)}" data-idx="${i}">查看上鎖照片</button><div id="photo-${i}"></div>`:''}</div>`).join(''):'<p class="muted">尚無簽認紀錄。</p>';document.querySelectorAll('.photo-link').forEach(b=>b.onclick=async()=>{try{const data=await api('asset',user.id,c.id,b.dataset.file);$('photo-'+b.dataset.idx).innerHTML=`<img alt="上鎖照片" src="${data}">`}catch(e){}});clearCanvas();$('photo').value='';operationKey=null}
function clearCanvas(){const canvas=$('signature'), rect=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(rect.width*devicePixelRatio));canvas.height=Math.max(1,Math.round(rect.height*devicePixelRatio));const ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#152c2b';ink=false}
function point(e){const r=$('signature').getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
$('signature').addEventListener('pointerdown',e=>{drawing=true;$('signature').setPointerCapture(e.pointerId);let [x,y]=point(e);let ctx=$('signature').getContext('2d');ctx.beginPath();ctx.moveTo(x,y)});$('signature').addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=point(e);const ctx=$('signature').getContext('2d');ctx.lineTo(x,y);ctx.stroke();ink=true});$('signature').addEventListener('pointerup',()=>drawing=false);$('signature').addEventListener('pointercancel',()=>drawing=false);
$('clearSign').onclick=clearCanvas;
$('loginBtn').onclick=async()=>{try{user=await api('login',$('emp').value);$('identity').textContent=user.name+'　'+user.id;$('login').classList.add('hide');$('workspace').classList.remove('hide');$('newBtn').classList.toggle('hide',!(user.roles.includes('經辦')&&user.supervisor));await load()}catch(e){}};
$('logout').onclick=()=>{user=null;current=null;$('workspace').classList.add('hide');$('login').classList.remove('hide');$('emp').value='';msg('')};
['search','stateFilter','dateFrom','dateTo'].forEach(x=>$(x).addEventListener('input',renderList));$('back').onclick=load;
$('newBtn').onclick=()=>{current=null;mode='create';operationKey=null;['device','reason','startDate','endDate'].forEach(x=>$(x).value='');try{const pending=JSON.parse(sessionStorage.getItem('pendingCreate:'+user.id)||'null');if(pending){operationKey=pending.key;Object.keys(pending.data).forEach(x=>$(x).value=pending.data[x]);msg('上次申請結果尚未確認。可直接重送相同內容，系統會查核是否已建立。')}}catch(e){}$('formTitle').textContent='新增斷電申請';view('formView')};$('cancelForm').onclick=()=>current?openCase(current.case.id):load();
$('resubmitBtn').onclick=async()=>{if(current.case.phase===-2){if(confirm('從復電第一關重新送出？'))await action('resubmit',{});return}mode='resubmit';const c=current.case;['device','reason','startDate','endDate'].forEach(x=>$(x).value=c[x]);$('formTitle').textContent='修改後重新送出';view('formView')};
$('submitForm').onclick=async()=>{const data={};['device','reason','startDate','endDate'].forEach(x=>data[x]=$(x).value);operationKey=operationKey||key();try{if(mode==='create'){const slot='pendingCreate:'+user.id, prior=JSON.parse(sessionStorage.getItem(slot)||'null');if(prior&&JSON.stringify(prior.data)!==JSON.stringify(data))return msg('上次申請結果尚未確認，請先以原內容重送或核對案件清單。');sessionStorage.setItem(slot,JSON.stringify({key:operationKey,data}));try{const id=await api('createCase',user.id,data,operationKey);sessionStorage.removeItem(slot);operationKey=null;await openCase(id)}catch(e){if(e.definitive){sessionStorage.removeItem(slot);operationKey=null}}}else{await action('resubmit',data)}}catch(e){msg(e.message||String(e))}};
async function action(kind,payload){operationKey=operationKey||key();try{const id=current.case.id;await api('applyAction',user.id,id,current.case.version,kind,payload,operationKey);operationKey=null;await openCase(id)}catch(e){}}
$('restoreBtn').onclick=()=>{if(confirm('確認施工完成並提出復電申請？'))action('restore',{})};
$('rejectBtn').onclick=()=>{const reason=prompt('請填寫退回原因');if(reason&&reason.trim())action('reject',{reason})};
function readPhoto(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.size>2e6)return reject(Error('照片請小於 2 MB'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('無法讀取照片'));r.readAsDataURL(file)})}
$('signBtn').onclick=async()=>{if(!ink)return msg('請先親筆簽名');try{const photo=await readPhoto($('photo').files[0]);if(current.stage==='電儀人員斷電'&&!photo)return msg('請附上上鎖照片');if(confirm('確認本關簽認？'))await action('sign',{signature:$('signature').toDataURL('image/png'),photo})}catch(e){msg(e.message)}};
$('pdfBtn').onclick=async()=>{try{const p=await api('downloadPdf',user.id,current.case.id);const a=document.createElement('a');a.href='data:application/pdf;base64,'+p.data;a.download=p.filename;document.body.appendChild(a);a.click();a.remove()}catch(e){}};
</script></body></html>
